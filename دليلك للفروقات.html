<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دليل الفروقات – Raya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f9;--sf:#fff;--sf2:#f7f9fc;--ink:#0f172a;--mut:#5b6880;--line:#e2e7f0;--brand:#2456e6;--brand-s:#e8eefe;--side:#0e1730;--side-ink:#c9d3ea;--win:#e3f7ec;--win-ink:#08733f;--win-b:#9bdcb8;--say:#fff6e0;--say-ink:#7a4d00;--say-b:#f3d48a;--obj:#fdecec;--obj-ink:#8f1d1d;--sh:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06);--r:16px}
html[data-theme=dark]{--bg:#0a1020;--sf:#131c33;--sf2:#18223d;--ink:#eef2fb;--mut:#9aa8c4;--line:#26324f;--brand:#7da2ff;--brand-s:#1b2a52;--side:#070c1a;--side-ink:#b7c3de;--win:#0f3324;--win-ink:#6fe3a6;--win-b:#1f6b48;--say:#33280c;--say-ink:#ffd67a;--say-b:#6b5416;--obj:#3a1717;--obj-ink:#ffb0b0;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15.5px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.rl{background:#fff;border-radius:14px;padding:12px 16px;margin:0 4px 14px;display:grid;place-items:center;cursor:pointer}.rl img{height:52px;display:block}
.cr{margin:22px 6px 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#8fa0c4;line-height:1.6;direction:ltr;text-align:center}.cr b{color:#fff;display:block;font-size:13px}
.hero{position:relative}.hl{background:#fff;border-radius:12px;padding:8px 12px;display:inline-block;margin-bottom:12px}.hl img{height:34px;display:block}
.by{direction:ltr;text-align:center;color:var(--mut);font-size:12.5px;margin:4px 0 10px}.by b{color:var(--ink)}
@media(min-width:901px){.hl{display:none}}
/* layout */
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px 30px;scrollbar-width:thin}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;color:#fff;font-weight:800;font-size:18px;cursor:pointer}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#22c55e);display:grid;place-items:center;font-style:normal;font-size:20px}
.logo small{display:block;font-weight:400;font-size:11.5px;color:#8fa0c4;margin-top:-4px}
.gt{font-size:11.5px;font-weight:700;color:#7386ad;padding:14px 10px 4px;letter-spacing:.3px}
.si{display:flex;align-items:center;gap:9px;width:100%;text-align:right;padding:7px 10px;border-radius:10px;color:var(--side-ink);font-size:14.5px}
.si:hover{background:rgba(255,255,255,.07);color:#fff}
.si.on{background:#2456e6;color:#fff;font-weight:700}
.si span{font-size:17px;width:22px;text-align:center}
main{min-width:0}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:10px;align-items:center}
.burger{display:none;font-size:22px;width:42px;height:42px;border-radius:12px;background:var(--sf);border:1px solid var(--line)}
.srch{position:relative;flex:1;max-width:620px}
.srch input{width:100%;height:44px;border-radius:13px;border:1.5px solid var(--line);background:var(--sf);color:var(--ink);font:inherit;padding:0 44px 0 14px;outline:0}
.srch input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-s)}
.srch:before{content:"🔎";position:absolute;right:14px;top:9px;font-size:16px;opacity:.7}
.res{position:absolute;top:50px;right:0;left:0;background:var(--sf);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);max-height:62vh;overflow:auto;display:none;padding:6px}
.res.open{display:block}
.res button{display:flex;gap:10px;align-items:center;width:100%;text-align:right;padding:9px 10px;border-radius:10px}
.res button:hover,.res button.k{background:var(--brand-s)}
.res b{font-weight:700}.res small{color:var(--mut);display:block;font-size:12.5px;line-height:1.3}
.res .none{padding:14px;color:var(--mut);text-align:center}
.tb{margin-inline-start:auto;display:flex;gap:8px}
.ib{height:44px;padding:0 13px;border-radius:13px;background:var(--sf);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.ib:hover{border-color:var(--brand)}
.ib.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.wrap{padding:22px;max-width:1180px;margin:0 auto}
/* home */
.hero{background:linear-gradient(135deg,#1c3fb8,#2456e6 45%,#16a394);color:#fff;border-radius:22px;padding:28px 26px;box-shadow:var(--sh)}
.hero h1{margin:0 0 6px;font-size:clamp(22px,3.4vw,32px);font-weight:800;line-height:1.3}
.hero p{margin:0;opacity:.92;max-width:640px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stats div{background:rgba(255,255,255,.16);border-radius:12px;padding:6px 14px;font-size:13.5px}
.stats b{font-size:18px;margin-inline-end:5px}
h2.g{font-size:17px;margin:26px 2px 10px;display:flex;align-items:center;gap:8px}
h2.g:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cc{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:right;display:flex;gap:12px;align-items:flex-start;transition:.15s;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.cc:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:var(--sh)}
.cc i{font-style:normal;font-size:26px;width:48px;height:48px;border-radius:14px;background:var(--brand-s);display:grid;place-items:center;flex:none}
.cc b{display:block;font-size:15.5px;line-height:1.4}
.cc small{color:var(--mut);font-size:12.5px;line-height:1.45;display:block;margin-top:2px}
/* category */
.bc{color:var(--mut);font-size:13.5px;margin-bottom:6px}
.bc a{color:var(--brand);font-weight:600}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ch i{font-style:normal;font-size:30px;width:58px;height:58px;border-radius:17px;background:var(--sf);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ch h1{margin:0;font-size:clamp(20px,3vw,27px);font-weight:800;line-height:1.3}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 16px;border-radius:999px;background:var(--sf);border:1.5px solid var(--line);font-weight:700;font-size:14.5px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.sec>h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec>h3 small{font-weight:400;color:var(--mut);font-size:13px}
.tys{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.ty{border:1.5px solid var(--line);border-radius:14px;padding:13px;background:var(--sf2);display:flex;flex-direction:column;gap:7px}
.ty .hd{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;line-height:1.35}
.ty .hd i{font-style:normal;font-size:22px}
.ty .for{font-size:14px}.ty .for b{color:var(--brand);font-size:12.5px;display:block}
.say{background:var(--say);color:var(--say-ink);border:1px dashed var(--say-b);border-radius:11px;padding:8px 10px;font-size:13.8px;margin-top:auto}
.say b{font-size:12px;display:block;opacity:.85}
/* advisor */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--sf2);font-size:14px;font-weight:600}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.off{opacity:.45;text-decoration:line-through}
.rk{margin-top:14px;display:grid;gap:8px}
.rk .hint{color:var(--mut);font-size:14px}
.bar{display:grid;grid-template-columns:minmax(120px,210px) 1fr 46px;gap:10px;align-items:center;font-size:14.5px}
.bar .nm{font-weight:700;line-height:1.3}
.bar .tr{height:14px;background:var(--sf2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--mut);border-radius:99px;transition:width .35s}
.bar.best .tr i{background:linear-gradient(90deg,#16a34a,#22c55e)}
.bar.best .nm{color:var(--win-ink)}
.bar .pc{font-weight:800;text-align:left;font-variant-numeric:tabular-nums}
.verdict{background:var(--win);border:1.5px solid var(--win-b);color:var(--win-ink);border-radius:13px;padding:11px 13px;margin-top:6px}
.verdict b{font-size:16.5px}.verdict p{margin:4px 0 0;font-size:14px}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:13px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);vertical-align:middle;text-align:center;min-width:140px}
tr>*:first-child{border-inline-start:0;text-align:right;position:sticky;right:0;background:var(--sf2);font-weight:700;min-width:118px;max-width:170px;z-index:2}
thead th{background:var(--ink);color:var(--bg);font-weight:800;font-size:15px;line-height:1.35}
thead th:first-child{background:var(--ink);color:var(--bg)}
thead th i{font-style:normal;display:block;font-size:20px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td:not(:first-child):not(.w){background:var(--sf2)}
td.w{background:var(--win);color:var(--win-ink);font-weight:700}
td.w:before{content:"✓ ";font-weight:800}
tfoot td{background:var(--sf2);font-weight:800;border-bottom:0;border-top:2px solid var(--line)}
tfoot .n{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:99px;background:var(--line);padding:0 8px}
tfoot .top1 .n{background:#16a34a;color:#fff}
.lg{color:var(--mut);font-size:12.5px;margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.lg span:before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--win);border:1px solid var(--win-b);margin-inline-end:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two .sec{margin-top:14px}
ul.tp{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.tp li{background:var(--sf2);border-radius:11px;padding:9px 12px;border-inline-start:4px solid var(--brand);font-size:14.3px}
.ob{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:8px}
.ob .q{background:var(--obj);color:var(--obj-ink);padding:8px 12px;font-weight:700;font-size:14.3px}
.ob .a{background:var(--win);color:var(--win-ink);padding:8px 12px;font-size:14.3px}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.note{color:var(--mut);font-size:12.5px;text-align:center;margin:22px 0 8px}
.cust .sales{display:none!important}
.cbanner{display:none;background:#16a34a;color:#fff;text-align:center;font-weight:700;font-size:13.5px;padding:5px}
.cust .cbanner{display:block}
.ov{display:none}
@media(max-width:900px){
.app{display:block}
aside{position:fixed;inset:0 0 0 auto;width:min(290px,84vw);z-index:60;transform:translateX(105%);transition:transform .25s}
.nav-open aside{transform:none}
.nav-open .ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50}
.burger{display:block;flex:none}
.top{padding:8px 12px;gap:7px}
.ib{padding:0 11px}.ib em{display:none}
.wrap{padding:14px 12px 30px}
.two{grid-template-columns:1fr}
.hero{padding:20px 18px;border-radius:18px}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.cc{flex-direction:column;gap:8px;padding:12px}
.sec{padding:13px}
th,td{min-width:128px;padding:9px 9px;font-size:13.8px}
tr>*:first-child{min-width:96px;max-width:112px;font-size:13px}
.bar{grid-template-columns:1fr 44px}.bar .nm{grid-column:1/-1}
}
@media print{
aside,.top,.nav2,.chips,.ov,.cbanner{display:none!important}
.app{display:block}body{background:#fff;font-size:12px}
.sec{box-shadow:none;break-inside:avoid}.tw{overflow:visible}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="cbanner">👁 وضع العميل – ملاحظات البيع مخفية. تقدر تلف الشاشة للعميل.</div>
<div class="app">
<aside id="side"></aside>
<div class="ov" onclick="nav(0)"></div>
<main>
<div class="top">
<button class="burger" onclick="nav(1)" aria-label="القائمة">☰</button>
<div class="srch"><input id="q" type="search" placeholder="ابحث: غسالة، انفرتر، نوفروست، OLED ..." autocomplete="off"><div class="res" id="res"></div></div>
<div class="tb">
<button class="ib" id="bc" onclick="cust()" title="إخفاء ملاحظات البيع لعرض الشاشة على العميل">👁 <em>وضع العميل</em></button>
<button class="ib" onclick="window.print()" title="طباعة">🖨</button>
<button class="ib" onclick="theme()" title="فاتح / داكن">🌓</button>
</div>
</div>
<div class="wrap" id="v"></div>
</main>
</div>

 if(T.length&&R.length)h=`<p><b>${c.n} – ${m.t}</b></p>`+R.map(r=>vRow(m,r,T.length>1?T:all)).join("");
 else if(T.length>1)h=`<p>الفرق بين <b>${T.map(i=>m.ty[i][0]).join(" و ")}</b>:</p><ul>${T.map(i=>`<li><b>${nm(m,i)}:</b> ${m.ty[i][2]}</li>`).join("")}</ul>${vDiff(m,T)}`;
 else if(N.length)h=vRank(m,N);
 else if(R.length)h=`<p><b>${c.n} – ${m.t}</b></p>`+R.map(r=>vRow(m,r,all)).join("");
 else if(T.length)h=vProf(m,T[0]);
 else if(tipQ)h=`<p><b>${c.e} ${c.n}</b></p>`;
 else h=vOver(c,m)+(k.th||pin?"":others(c,m));
 if(tipQ)h+=`<p><b>💡 معلومة مفيدة</b></p><ul>${m.tp.map(t=>`<li>• ${t}</li>`).join("")}</ul>`;
 return h+openB(c,m)}
function fallback(text){const ws=norm(text).split(/\s+/).filter(w=>w.length>3),hs=[];IDX.forEach(x=>{if(x.p>1&&ws.some(w=>x.k.includes(w))&&!hs.some(y=>y.id===x.id&&y.i===x.i))hs.push(x)});
 return hs.length?`<p>مش متأكد من قصدك – يمكن تقصد:</p>${hs.slice(0,5).map(x=>`<button class="bl" data-go="${x.id}/${x.i}">${x.e} ${x.a}</button>`).join("")}`:`<p>السؤال ده مش موجود في محتوى الدليل. أنا بجاوب من المقارنات اللي هنا بس.</p>`+sugg()}
function sugg(){let L=["الفرق بين الفول والفوق أوتوماتيك","تكييف لأوضة 4×5","OLED ولا QLED؟","ثلاجة نوفروست ولا ديفروست","أنسب دفاية لأوضة أطفال"];
 if(st.cat){const c=D.find(x=>x.id===st.cat),m=c.c[st.cmp];L=[m.t,...(m.nd||[]).slice(0,3).map(n=>n[0])];return `<p>جرّب في ${c.n}:</p>`+L.map(x=>`<button class="bq" data-q="${x}" data-pin="${c.id}/${st.cmp}">${x}</button>`).join("")}
 return `<p>جرّب تسأل:</p>`+L.map(x=>`<button class="bq" data-q="${x}">${x}</button>`).join("")}
function intro(s){return `<p>أهلاً 👋 أنا <b>Dr. H</b> 🤖</p><p>اسألني عن الفرق بين أي نوعين، أو قولّي العميل مهتم بإيه وأرشّح لك الأنسب – الرد فوري من محتوى الدليل.</p>`+(s?sugg():"")}
function say(h,u){const d=document.createElement("div");d.className="ms "+(u?"u":"b");d.innerHTML=h;BM.appendChild(d);BM.scrollTop=u?BM.scrollHeight:Math.max(0,d.offsetTop-60);return d}
function ask(text,pin){text=(text||"").trim();if(!text)return;bi.value="";say(E(text),1);const t=say(`<div class="dots"><i></i><i></i><i></i></div>`);let h;try{h=answer(text,pin)}catch(e){h=`<p>حصلت مشكلة في السؤال ده – جرّب صيغة تانية.</p>`}setTimeout(()=>{t.innerHTML=h;BM.scrollTop=Math.max(0,t.offsetTop-60)},260)}
function bot(o){document.body.classList.toggle("bot-open",!!o);if(o){if(!started){started=1;say(intro(1))}if(innerWidth>900)bi.focus()}}
function botReset(){BM.innerHTML="";ctx=null;say(intro(1))}
bi.addEventListener("keydown",e=>{if((e.key==="Enter"||e.keyCode===13)&&!e.isComposing){e.preventDefault();e.stopPropagation();ask(bi.value)}});
$("#bs").addEventListener("click",()=>{ask(bi.value);bi.focus()});
BM.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.go){const[id,i]=b.dataset.go.split("/");go(id,+i);if(innerWidth<=900)bot(0)}else if(b.dataset.q){const p=b.dataset.pin;ask(b.dataset.q,p?[p.split("/")[0],+p.split("/")[1]]:null)}});
</script>
